name: Test GitHub Actions Functionality

# Trigger workflow on every push and pull request
on:
  push:
  pull_request:

jobs:
  check-functionality:
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner
    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run a simple shell command
      - name: Print test message
        run: echo "✅ GitHub Actions is working!"

      # Step 3: Show system info
      - name: Show system info
        run: |
          echo "Running on:"
          uname -a
          echo "Current directory:"
          pwd
          echo "Files in repo:"
          ls -la
